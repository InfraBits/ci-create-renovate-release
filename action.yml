name: Create renovate release
description: Create an incremental GitHub release on renovate changes

inputs:
  github-token:
    description: GitHub token to use for API calls
    required: true

  create-release:
    description: Create a Github release if a new tag has been calculated
    required: false
    default: "true"

  skip-ci-changes:
    description: Skip creating a release if the only changes are for CI
    required: false
    default: "true"

  skip-development-changes:
    description: Skip creating a release if the only changes are in development dependencies
    required: false
    default: "true"

outputs:
  tag_name:
    description: The tag name of the created release, or empty if no release was created
    value: ${{ steps.get-tag.outputs.tag_name }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Get the latest release tag
      id: get-release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          let latest_tag;
          try {
            ({ data: { tag_name: latest_tag } } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            }));
          } catch (error) {
            if (error.status === 404) {
              // We may not have a latest release - this is definitely the case for new repos
              console.log(`No latest release found for ${context.repo.owner}/${context.repo.repo}, skipping logic`);
              return;
            }
            throw error;
          }

          if (!latest_tag) {
            console.log(`No latest release found for ${context.repo.owner}/${context.repo.repo}, skipping logic`);
            return;
          }

          core.setOutput('latest_tag', latest_tag);

    - name: Classify the changes
      id: classify-changes
      shell: bash
      run: |
        changed_files=$(git diff --name-only ${{ steps.get-release.outputs.latest_tag }}...HEAD)
        
        # Check for Github action related changes
        if [ -n "$(grep -E '^\.github/' <<< "${changed_files}")" ];
        then
          echo "Found CI changes"
          echo "have_ci_changes=true" >> "$GITHUB_OUTPUT"
        fi
        
        # Check for dependency changes, classifying them as production or development
        if [ -n "$(grep -E '^(pyproject\.toml|poetry\.lock)$' <<< "${changed_files}")" ];
        then
          python3 "${GITHUB_ACTION_PATH}/scripts/poetry.py" "${{ steps.get-release.outputs.latest_tag }}"
        fi

        if [ -n "$(grep -E '^(package\.json|package-lock\.json)$' <<< "${changed_files}")" ];
        then
          python3 "${GITHUB_ACTION_PATH}/scripts/npm.py" "${{ steps.get-release.outputs.latest_tag }}"
        fi

        if [ -n "$(grep -E '^(composer\.json|composer\.lock)$' <<< "${changed_files}")" ];
        then
          python3 "${GITHUB_ACTION_PATH}/scripts/composer.py" "${{ steps.get-release.outputs.latest_tag }}"
        fi

        # Check for any changes not related to the above
        if [ -n "$(grep -Ev '^((pyproject\.toml|poetry\.lock|package\.json|package-lock\.json|composer\.json|composer\.lock)$|\.github/)' <<< "${changed_files}")" ];
        then
          echo "have_changes=true" >> "$GITHUB_OUTPUT"
        fi
      if: steps.get-release.outputs.latest_tag
      
    - name: Check authors since the last release
      id: check-author
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python3 "${GITHUB_ACTION_PATH}/scripts/check_commits.py" "${{ steps.get-release.outputs.latest_tag }}"
      if: |
        steps.get-release.outputs.latest_tag &&
        (
          steps.classify-changes.outputs.have_changes == 'true' ||
          (steps.classify-changes.outputs.have_ci_changes == 'true' && inputs.skip-ci-changes != 'true') ||
          (steps.classify-changes.outputs.have_development_changes == 'true' && inputs.skip-development-changes != 'true')
        )

    - name: Calculate next release tag
      id: get-tag
      shell: bash
      run: |
        # Assume some semantic ish version, increase the minor version
        latest_tag="${{ steps.get-release.outputs.latest_tag }}"

        # If the version is `v<timestamp>` then use the current timestamp
        if [ ! -z "$(grep -E '^v[0-9]+$' <<< "${latest_tag}")" ];
        then
          echo "Latest tag looks like a timestamp, using current timestamp"
          echo "tag_name=v$(date +%s)" >> "$GITHUB_OUTPUT"
          exit
        fi

        # If the version is semantic, then increase the patch version
        if [ ! -z "$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "${latest_tag}")" ];
        then
          echo "Latest tag looks like a semantic version, increasing patch"
          echo "tag_name=$(awk -F '.' '{print $1"."$2"."($3 + 1)}' <<< "${latest_tag}")" >> "$GITHUB_OUTPUT"
          exit
        fi

        echo "Could not figure out tag format: $latest_tag"
        exit 2
      if: steps.check-author.outputs.have_only_bot_commits == 'true'

    - name: Create GitHub release
      id: create-release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: `Release ${{ steps.get-tag.outputs.tag_name }}`,
            tag_name: '${{ steps.get-tag.outputs.tag_name }}',
            draft: false,
            prerelease: false,
            generate_release_notes: true,
          });
          console.log(`Created release for tag: ${release.data.name}`);

      if: inputs.create-release == 'true' && steps.get-tag.outputs.tag_name
